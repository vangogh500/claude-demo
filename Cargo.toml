[package]
name = "story-pointing"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "process", "time"] }
tokio-tungstenite = "0.29"
