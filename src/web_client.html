<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Pointing</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 1rem auto; padding: 0 1rem; line-height: 1.4; }
  label { display: block; margin: 0.75rem 0 0.25rem; }
  input { font-size: 1rem; padding: 0.5rem; width: 100%; box-sizing: border-box; }
  button { font-size: 1rem; padding: 0.5rem 1rem; margin: 0.5rem 0.5rem 0 0; }
  .code { font-size: 2.5rem; font-weight: bold; letter-spacing: 0.2em; }
  .mark { color: #555; font-size: 0.9rem; }
  .error { background: #fdd; padding: 0.5rem; margin: 0.5rem 0; }
  ul { padding-left: 1.25rem; }
</style>
</head>
<body>
<div id="web-client"></div>
<script>
"use strict";

// The single state object. The view is rendered from it alone; no element holds
// state of its own. Later tickets extend this state and the render function.
const state = {
  screen: "entry",       // "entry" | "room"
  connecting: false,     // a connection attempt is in flight
  name: "",
  joinCode: location.hash.slice(1),
  message: null,         // a dismissable notice or error
  room: null,            // built from room_snapshot, updated by events
};

let socket = null;

function connect(firstCommand) {
  if (socket !== null) { const old = socket; socket = null; old.close(); }
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const mine = new WebSocket(scheme + "//" + location.host + "/ws");
  socket = mine;
  state.connecting = true;
  mine.onopen = () => mine.send(JSON.stringify(firstCommand));
  mine.onmessage = (e) => { if (socket === mine) { apply(JSON.parse(e.data)); render(); } };
  mine.onclose = () => {
    if (socket !== mine) return;
    socket = null;
    state.connecting = false;
    state.message = "connection_closed";
    render();
  };
  render();
}

function normalizedCode() { return state.joinCode.trim().toUpperCase(); }

function createRoom() {
  connect({ type: "create_room", name: state.name });
}

function joinRoom() {
  connect({ type: "join_room", join_code: normalizedCode(), name: state.name });
}

function apply(ev) {
  const room = state.room;
  switch (ev.type) {
    case "room_snapshot":
      state.room = {
        joinCode: ev.join_code,
        you: ev.you,
        facilitatorId: ev.facilitator_id,
        participants: ev.participants,
        items: ev.items,
        activeItemId: ev.active_item_id,
        voted: new Set(ev.voted),
      };
      state.screen = "room";
      state.connecting = false;
      state.joinCode = ev.join_code;
      state.message = null;
      break;
    case "participant_joined":
      if (!room.participants.some((p) => p.id === ev.participant_id)) {
        room.participants.push({ id: ev.participant_id, name: ev.name });
      }
      break;
    case "participant_left":
      room.participants = room.participants.filter((p) => p.id !== ev.participant_id);
      room.voted.delete(ev.participant_id);
      break;
    case "facilitator_changed":
      room.facilitatorId = ev.participant_id;
      break;
    case "error":
      state.connecting = false;
      state.message = ev.code;
      break;
  }
}

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  Object.assign(el, props || {});
  for (const child of children) {
    el.append(child);
  }
  return el;
}

function shareLink() {
  return location.origin + location.pathname + "#" + state.room.joinCode;
}

// The entry screen's elements are created once and kept across renders, so
// editing is never disturbed; render only sets value/disabled from state.
const entry = (() => {
  const name = h("input", { id: "name", oninput: (e) => { state.name = e.target.value; render(); } });
  const code = h("input", { id: "code", oninput: (e) => { state.joinCode = e.target.value; render(); } });
  const create = h("button", { onclick: createRoom }, "Create Room");
  const join = h("button", { onclick: joinRoom }, "Join");
  return { name, code, create, join };
})();

const entryView = h("div", {}, h("h1", {}, "Story Pointing"),
  h("label", { htmlFor: "name" }, "Display name"), entry.name, entry.create,
  h("label", { htmlFor: "code" }, "Join Code"), entry.code, entry.join);

function renderEntry() {
  const blocked = state.name.trim() === "" || state.connecting;
  if (entry.name.value !== state.name) entry.name.value = state.name;
  if (entry.code.value !== state.joinCode) entry.code.value = state.joinCode;
  entry.create.disabled = blocked;
  entry.join.disabled = blocked;
}

function renderRoom() {
  const room = state.room;
  const facilitator = room.facilitatorId;
  return [
    h("h1", {}, "Room"),
    h("div", { className: "code" }, room.joinCode),
    h("p", {}, "Share link: ", h("a", { href: shareLink() }, shareLink())),
    h("h2", {}, "Participants"),
    h("ul", {}, ...room.participants.map((p) => {
      const marks = [];
      if (p.id === facilitator) marks.push("Facilitator");
      if (p.id === room.you) marks.push("you");
      return h("li", {}, p.name, marks.length ? h("span", { className: "mark" }, " (" + marks.join(", ") + ")") : ""
      );
    })),
  ];
}

const messageBox = h("div", {});
const roomBox = h("div", {});
document.getElementById("web-client").append(messageBox, entryView, roomBox);

function render() {
  messageBox.replaceChildren(...(state.message === null ? [] : [
    h("div", { className: "error" }, state.message,
      h("button", { onclick: () => { state.message = null; render(); } }, "Dismiss"))]));
  entryView.hidden = state.screen !== "entry";
  roomBox.hidden = state.screen !== "room";
  if (state.screen === "entry") renderEntry();
  else roomBox.replaceChildren(...renderRoom());
}

render();
</script>
</body>
</html>
